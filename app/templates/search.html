{% extends "base.html" %}

{% block title %}MyTodo - 搜索{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-6 md:py-10">

  <div class="text-center mb-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">搜索待办</h1>
    <p class="text-sm text-slate-500">输入关键词查找任务</p>
  </div>

  <div class="max-w-xl mx-auto mb-6">
    <div class="relative">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="search-input" type="text" placeholder="搜索待办标题..." autofocus
             class="w-full h-12 pl-12 pr-4 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-2 focus:ring-brand-200 focus:border-brand-400 shadow-sm transition-all">
    </div>
    <div class="flex gap-2 mt-3 justify-center">
      <button data-filter="all" class="filter-btn btn-min px-4 py-2 rounded-full text-xs font-semibold bg-slate-900 text-white transition-colors">全部</button>
      <button data-filter="pending" class="filter-btn btn-min px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors">进行中</button>
      <button data-filter="done" class="filter-btn btn-min px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors">已完成</button>
    </div>
  </div>

  <div id="search-results"></div>

  <div id="search-empty" class="hidden text-center py-16">
    <svg class="mx-auto w-24 h-24 text-slate-200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="35" fill="none" stroke="#e2e8f0" stroke-width="3"/>
      <path d="M50 30v20l12 8" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p class="mt-4 text-sm font-medium text-slate-600">输入关键词开始搜索</p>
    <p class="mt-1 text-xs text-slate-400">支持按标题搜索所有待办</p>
  </div>

  <div id="search-no-result" class="hidden text-center py-16">
    <svg class="mx-auto w-24 h-24 text-slate-200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <circle cx="50" cy="50" r="35" fill="none" stroke="#e2e8f0" stroke-width="3"/>
      <path d="M35 35l30 30M65 35l-30 30" fill="none" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <p class="mt-4 text-sm font-medium text-slate-600">没有找到匹配的待办</p>
    <p class="mt-1 text-xs text-slate-400">换个关键词试试</p>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script>
let allTodos = [];
let allCategories = [];
let currentFilter = 'all';
let searchText = '';

async function loadTodos() {
  const r = await apiFetch('/api/todos', {silent: true});
  if (r.ok) allTodos = r.data;
}
async function loadCategories() {
  const r = await apiFetch('/api/categories', {silent: true});
  if (r.ok) allCategories = r.data;
}

function renderSearchCard(t) {
  const cat = allCategories.find(c => c.id === t.category_id);
  const catName = cat ? cat.name : '无分类';
  const catColor = cat ? cat.color : '#6b7280';
  const statusText = t.status === 'done' ? '已完成' : '进行中';
  const statusColor = t.status === 'done' ? 'text-emerald-600 bg-emerald-50' : 'text-brand-600 bg-brand-50';
  const priorityLabel = {high:'高', medium:'中', low:'低'}[t.priority] || '';
  const priorityColor = {high:'text-red-600 bg-red-50', medium:'text-amber-600 bg-amber-50', low:'text-slate-500 bg-slate-50'}[t.priority] || '';

  return `<div class="bg-white border border-slate-200 rounded-xl p-4 hover:shadow-md transition-shadow cursor-pointer" onclick="openDetail(${t.id})">
    <div class="flex items-start justify-between gap-3">
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-slate-800 mb-1.5">${escapeHtml(t.title || '无标题')}</div>
        <div class="flex flex-wrap gap-1.5">
          <span class="text-xs px-2 py-0.5 rounded-full ${statusColor} font-medium">${statusText}</span>
          ${priorityLabel ? `<span class="text-xs px-2 py-0.5 rounded-full ${priorityColor} font-medium">${priorityLabel}优先级</span>` : ''}
          <span class="text-xs px-2 py-0.5 rounded-full text-slate-600 bg-slate-50 font-medium flex items-center gap-1">
            <span class="w-2 h-2 rounded-full" style="background-color:${catColor}"></span>${escapeHtml(catName)}
          </span>
          ${t.due_date ? `<span class="text-xs px-2 py-0.5 rounded-full text-slate-500 bg-slate-50">${t.due_date}</span>` : ''}
        </div>
      </div>
    </div>
  </div>`;
}

function renderResults() {
  const container = document.getElementById('search-results');
  const emptyEl = document.getElementById('search-empty');
  const noResultEl = document.getElementById('search-no-result');

  if (!searchText) {
    container.innerHTML = '';
    container.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    noResultEl.classList.add('hidden');
    return;
  }

  emptyEl.classList.add('hidden');
  let matches = allTodos.filter(t => (t.title || '').toLowerCase().includes(searchText));
  if (currentFilter === 'pending') matches = matches.filter(t => t.status === 'pending');
  else if (currentFilter === 'done') matches = matches.filter(t => t.status === 'done');

  if (matches.length === 0) {
    container.innerHTML = '';
    container.classList.add('hidden');
    noResultEl.classList.remove('hidden');
    return;
  }

  noResultEl.classList.add('hidden');
  container.classList.remove('hidden');

  // Group by date
  const groups = {};
  const noDate = [];
  for (const t of matches) {
    if (!t.due_date || t.due_date === '0000-00-00') { noDate.push(t); continue; }
    if (!groups[t.due_date]) groups[t.due_date] = [];
    groups[t.due_date].push(t);
  }

  let html = '<div class="space-y-6">';
  const sortedDates = Object.keys(groups).sort((a, b) => a.localeCompare(b));
  for (const dateStr of sortedDates) {
    const d = new Date(dateStr + 'T00:00:00');
    const label = d.toLocaleDateString('zh-CN', {month:'long', day:'numeric', weekday:'short'});
    html += '<div><div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">' + label + '</div><div class="space-y-2">' + groups[dateStr].map(renderSearchCard).join('') + '</div></div>';
  }
  if (noDate.length > 0) {
    html += '<div><div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">未设日期</div><div class="space-y-2">' + noDate.map(renderSearchCard).join('') + '</div></div>';
  }
  html += '</div>';
  container.innerHTML = html;
}

document.getElementById('search-input').addEventListener('input', (e) => {
  searchText = e.target.value.trim().toLowerCase();
  renderResults();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.className = 'filter-btn btn-min px-4 py-2 rounded-full text-xs font-semibold bg-white text-slate-600 border border-slate-200 hover:bg-slate-50 transition-colors';
    });
    btn.className = 'filter-btn btn-min px-4 py-2 rounded-full text-xs font-semibold bg-slate-900 text-white transition-colors';
    currentFilter = btn.dataset.filter;
    renderResults();
  });
});

(async () => {
  await loadTodos();
  await loadCategories();
  document.getElementById('search-input').focus();
})();
</script>
{% endblock %}
